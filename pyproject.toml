[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siagan"
version = "1.0.0"
description = "Official PyTorch implementation of 'SIA-GAN: Scrambling Inversion Attack Using Generative Adversarial Network' (IEEE Access 2021)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koki Madono" }]
keywords = [
    "image scrambling",
    "privacy-preserving machine learning",
    "generative adversarial network",
    "inversion attack",
    "learnable image encryption",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "numpy",
    "pillow",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
examples = ["matplotlib", "scikit-image"]
test = ["pytest"]

[project.urls]
Homepage = "https://madonokouki.github.io/projects/siagan/"
Repository = "https://github.com/MADONOKOUKI/SIA-GAN"
Paper = "https://doi.org/10.1109/ACCESS.2021.3112684"

[tool.setuptools]
packages = ["siagan"]

[tool.setuptools.package-data]
siagan = ["resources/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
